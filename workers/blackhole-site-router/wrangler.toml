# The subdomain router for published sites. Matches the Worker deployed in the
# Cloudflare dashboard as of 2026-09-22. Deploy from this folder: npx wrangler deploy
name = "blackhole-site-router"
main = "worker.js"
compatibility_date = "2026-09-22"
routes = [{ pattern = "*.blackhole-ai-tech.com/*", zone_name = "blackhole-ai-tech.com" }]

[observability]
enabled = true
